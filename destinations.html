<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations | Sultan Kudarat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2 col-7 col-sm-auto me-0" href="index.html">
                <img src="images/SKOS.png" alt="SK Logo" height="40" class="d-inline-block align-top rounded flex-shrink-0">
                <span class="custom-navbar-brand-text d-inline-block">SULTAN KUDARAT</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex mx-auto my-2 my-lg-0 col-12 col-lg-4" action="destinations.html" method="GET">
                    <input class="form-control form-control-sm me-2 bg-secondary text-white border-0" type="search" name="search" placeholder="Search categories (e.g., Mountain, Beach)..." aria-label="Search">
                    <button class="btn btn-sm btn-outline-warning" type="submit">Search</button>
                </form>
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold text-warning" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="culture.html">Culture</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Inquire</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center fw-bold mb-4">Discover Marvelous Spots</h1>

        <div class="row g-3 mb-5 justify-content-center">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control form-control-lg shadow-sm" placeholder="Search by name, city, or municipality...">
            </div>
            <div class="col-12 text-center">
                <div class="d-flex flex-wrap justify-content-center gap-2 mt-2" id="filterButtonGroup">
                    <button class="btn btn-outline-dark filter-btn active" data-category="All">All</button>
                    <button class="btn btn-outline-dark filter-btn" data-category="Beach">Beach</button>
                    <button class="btn btn-outline-dark filter-btn" data-category="Mountain">Mountain</button>
                    <button class="btn btn-outline-dark filter-btn" data-category="Waterfall">Waterfall</button>
                    <button class="btn btn-outline-dark filter-btn" data-category="Historical Site">Historical Site</button>
                    <button class="btn btn-outline-dark filter-btn" data-category="Island">Island</button>
                    <button class="btn btn-outline-dark filter-btn" data-category="Adventure">Adventure</button>
                </div>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="destinationsGrid"></div>
    </div>

    <div class="modal fade" id="destinationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" id="modalTargetBody"></div>
        </div>
    </div>

    <footer class="bg-success text-white text-center py-4 mt-auto border-top border-warning border-3">
        <p class="mb-0">&copy; 2026 Sultan Kudarat Provincial Tourism Council. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
