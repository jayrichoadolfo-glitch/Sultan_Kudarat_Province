<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Your Trip | Inquiry Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- NAVIGATION BAR WITH GLOBAL SEARCH -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2 col-7 col-sm-auto me-0" href="index.html">
                <img src="images/SKOS.png" alt="SK Logo" height="40" class="d-inline-block align-top rounded flex-shrink-0">
                <span class="custom-navbar-brand-text d-inline-block">SULTAN KUDARAT</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex mx-auto my-2 my-lg-0 col-12 col-lg-4" action="destinations.html" method="GET">
                    <input class="form-control form-control-sm me-2 bg-secondary text-white border-0" type="search" name="search" placeholder="Search categories (e.g., Mountain, Beach)..." aria-label="Search">
                    <button class="btn btn-sm btn-outline-warning" type="submit">Search</button>
                </form>
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="culture.html">Culture</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold text-warning" href="contact.html">Inquire</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENT FORM -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow border-0 p-4 p-md-5">
                    <h2 class="fw-bold text-center mb-2">Travel Inquiry Form</h2>
                    <p class="text-center text-muted mb-4">Fill out your travel details and our regional tourism team will reach out to you.</p>
                    
                    <div id="errorAlertBox" class="alert alert-danger d-none" role="alert"></div>

                    <form id="inquiryForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" id="fullName" class="form-control" placeholder="Jayricho Adolfo">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" id="emailAddress" class="form-control" placeholder="name@example.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Contact Number</label>
                                <input type="text" id="contactNumber" class="form-control" placeholder="09123456789">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Selected Destination</label>
                                <select id="selectedDestination" class="form-select">
                                    <option value="">-- Choose Target Destination --</option>
                                    <option value="Provincial Capitol">Provincial Capitol Building</option>
                                    <option value="Bamban Falls">Bamban Falls</option>
                                    <option value="Balot Island">Balot Island (Kalamansig)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Travel Date</label>
                                <input type="date" id="travelDate" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Number of Visitors</label>
                            <input type="number" id="visitorCount" class="form-control" min="1" placeholder="1">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Message / Special Requests</label>
                            <textarea id="userMessage" class="form-control" rows="4" placeholder="Tell us more about your itinerary..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-3 fw-bold shadow">Submit Inquiry Details</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-success text-white text-center py-4 mt-auto border-top border-warning border-3">
        <p class="mb-0">&copy; 2026 Sultan Kudarat Provincial Tourism Council. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
